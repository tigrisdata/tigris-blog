<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 336"
  width="600"
  height="336"
  style="background: transparent"
>
  <style>
    text {
      font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI",
        Helvetica, Arial, sans-serif;
    }
    .title {
      font-size: 16px;
      fill: #62feb5;
      font-weight: 600;
    }
    .sub {
      font-size: 12px;
      fill: #94a3b8;
    }
    .small {
      font-size: 12px;
      fill: #bac1be;
    }
    .tiny {
      font-size: 10px;
      fill: #94a3b8;
    }
    .box {
      rx: 4;
      ry: 4;
      fill: #1a2e35;
      stroke: #2a3731;
      stroke-width: 1;
    }
    .accent {
      rx: 4;
      ry: 4;
      fill: rgba(98, 254, 181, 0.14);
      stroke: rgba(98, 254, 181, 0.45);
      stroke-width: 1;
    }
    .arrow {
      stroke: #94a3b8;
      stroke-width: 1;
      fill: none;
    }
    .arrowAccent {
      stroke: rgba(98, 254, 181, 0.8);
      stroke-width: 1.2;
      fill: none;
    }
    .step {
      font-size: 13px;
      fill: #62feb5;
      font-weight: 600;
    }
  </style>

  <text x="300" y="26" text-anchor="middle" class="title">
    Sizes come from the cache, not the counters
  </text>
  <text x="300" y="44" text-anchor="middle" class="sub">
    listing 500 buckets with sizes, ~90% cache hit rate
  </text>

  <!-- gateway box (left) -->
  <rect x="30" y="130" width="120" height="60" class="box" />
  <text x="90" y="156" text-anchor="middle" class="small">gateway</text>
  <text x="90" y="172" text-anchor="middle" class="tiny">
    assembles the page
  </text>

  <!-- backend box (top right) -->
  <rect x="420" y="72" width="150" height="60" class="box" />
  <text x="495" y="98" text-anchor="middle" class="small">backend</text>
  <text x="495" y="114" text-anchor="middle" class="tiny">
    FoundationDB counters
  </text>

  <!-- cache box (bottom right) -->
  <rect x="420" y="196" width="150" height="60" class="accent" />
  <text x="495" y="222" text-anchor="middle" class="small">edge cache</text>
  <text x="495" y="238" text-anchor="middle" class="tiny">
    remembered sizes
  </text>

  <!-- step 1: gateway -> backend, names only -->
  <line x1="150" y1="140" x2="416" y2="98" class="arrow" />
  <path d="M 416 98 l -7 0.5 l 2.5 6.5 z" fill="#94a3b8" />
  <text x="168" y="98" class="step">1</text>
  <text x="180" y="98" class="small">get the bucket names — no sizes</text>
  <text x="180" y="112" class="tiny">one cheap range read for all 500</text>

  <!-- step 2: gateway -> cache -->
  <line x1="150" y1="180" x2="416" y2="222" class="arrowAccent" />
  <path d="M 416 222 l -7 -0.5 l 2.5 -6.5 z" fill="#62feb5" />
  <text x="168" y="226" class="step">2</text>
  <text x="180" y="226" class="small">ask the cache for those 500 sizes</text>
  <text x="180" y="240" class="tiny">~450 already known — done, for free</text>

  <!-- step 3: backend <- gateway (only misses) -->
  <line x1="280" y1="142" x2="416" y2="120" class="arrow" stroke-dasharray="4 3" />
  <path d="M 416 120 l -7 0.5 l 2.5 6.5 z" fill="#94a3b8" />
  <text x="240" y="160" class="step">3</text>
  <text x="252" y="160" class="small">size ONLY the ~50 unknown</text>
  <text x="252" y="174" class="tiny">one RPC; results go into the cache</text>

  <!-- takeaway -->
  <text x="300" y="292" text-anchor="middle" class="small">
    the counters are scanned for 50 buckets instead of 500 —
  </text>
  <text x="300" y="310" text-anchor="middle" class="sub">
    and on a fully warm page, step 3 never happens at all
  </text>
</svg>
