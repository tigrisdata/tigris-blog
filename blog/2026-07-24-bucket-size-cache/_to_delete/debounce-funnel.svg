<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 200"
  width="600"
  height="200"
  style="background: transparent"
>
  <style>
    text {
      font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI",
        Helvetica, Arial, sans-serif;
    }
    .title {
      font-size: 16px;
      fill: #62feb5;
      font-weight: 600;
    }
    .sub {
      font-size: 12px;
      fill: #94a3b8;
    }
    .small {
      font-size: 12px;
      fill: #bac1be;
    }
    .tiny {
      font-size: 10px;
      fill: #94a3b8;
    }
    .box {
      rx: 4;
      ry: 4;
      fill: #1a2e35;
      stroke: #2a3731;
      stroke-width: 1;
    }
    .accent {
      rx: 4;
      ry: 4;
      fill: rgba(98, 254, 181, 0.14);
      stroke: rgba(98, 254, 181, 0.45);
      stroke-width: 1;
    }
    .tick {
      stroke: #94a3b8;
      stroke-width: 1.5;
    }
    .arrowAccent {
      stroke: rgba(98, 254, 181, 0.8);
      stroke-width: 1.2;
      fill: none;
    }
  </style>

  <defs>
    <clipPath id="df-storm-clip">
      <rect x="40" y="78" width="126" height="34" />
    </clipPath>
  </defs>

  <text x="300" y="26" text-anchor="middle" class="title">
    A write storm becomes one cache operation
  </text>

  <!-- incoming ticks: conveyor marching toward the debounce box -->
  <g clip-path="url(#df-storm-clip)">
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="8 0"
        dur="0.25s"
        repeatCount="indefinite"
      />
      <line class="tick" x1="32" y1="82" x2="32" y2="108" />
      <line class="tick" x1="40" y1="82" x2="40" y2="108" />
      <line class="tick" x1="48" y1="82" x2="48" y2="108" />
      <line class="tick" x1="56" y1="82" x2="56" y2="108" />
      <line class="tick" x1="64" y1="82" x2="64" y2="108" />
      <line class="tick" x1="72" y1="82" x2="72" y2="108" />
      <line class="tick" x1="80" y1="82" x2="80" y2="108" />
      <line class="tick" x1="88" y1="82" x2="88" y2="108" />
      <line class="tick" x1="96" y1="82" x2="96" y2="108" />
      <line class="tick" x1="104" y1="82" x2="104" y2="108" />
      <line class="tick" x1="112" y1="82" x2="112" y2="108" />
      <line class="tick" x1="120" y1="82" x2="120" y2="108" />
      <line class="tick" x1="128" y1="82" x2="128" y2="108" />
      <line class="tick" x1="136" y1="82" x2="136" y2="108" />
      <line class="tick" x1="144" y1="82" x2="144" y2="108" />
      <line class="tick" x1="152" y1="82" x2="152" y2="108" />
      <line class="tick" x1="160" y1="82" x2="160" y2="108" />
    </g>
  </g>
  <text x="100" y="130" text-anchor="middle" class="small">100 writes/sec</text>
  <text x="100" y="144" text-anchor="middle" class="tiny">to one hot bucket</text>

  <line x1="166" y1="95" x2="216" y2="95" class="arrowAccent" />
  <path d="M 216 95 l -6 -3.5 v 7 z" fill="#62feb5" />

  <!-- debounce box -->
  <rect x="222" y="66" width="156" height="58" class="box" />
  <text x="300" y="90" text-anchor="middle" class="small">per-pod debounce</text>
  <text x="300" y="106" text-anchor="middle" class="tiny">
    in-memory, no network hop
  </text>
  <text x="300" y="140" text-anchor="middle" class="tiny">
    "already handled this bucket
  </text>
  <text x="300" y="152" text-anchor="middle" class="tiny">
    within the cooldown? drop it."
  </text>

  <line x1="384" y1="95" x2="434" y2="95" class="arrowAccent" />
  <path d="M 434 95 l -6 -3.5 v 7 z" fill="#62feb5" />

  <!-- the one operation that makes it through, every ~3s -->
  <circle cy="95" r="5.5" fill="#62feb5">
    <animate
      attributeName="cx"
      values="384;430;430"
      keyTimes="0;0.2;1"
      dur="3s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values="1;1;0;0"
      keyTimes="0;0.18;0.28;1"
      dur="3s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- single op out -->
  <rect x="440" y="66" width="130" height="58" class="accent">
    <animate
      attributeName="stroke"
      values="rgba(98,254,181,0.45);rgba(98,254,181,1);rgba(98,254,181,0.45)"
      keyTimes="0;0.3;1"
      dur="3s"
      repeatCount="indefinite"
    />
  </rect>
  <text x="505" y="90" text-anchor="middle" class="small">~1 TTL-shorten</text>
  <text x="505" y="106" text-anchor="middle" class="tiny">per 15-min window</text>

  <!-- takeaway -->
  <text x="300" y="186" text-anchor="middle" class="sub">
    the suppressed writes cost nothing — not even a round-trip to the cache
  </text>
</svg>
