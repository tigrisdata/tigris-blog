  <style>
    text {
      font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI",
        Helvetica, Arial, sans-serif;
    }
    .title {
      font-size: 16px;
      fill: #62feb5;
      font-weight: 600;
    }
    .sub {
      font-size: 12px;
      fill: #94a3b8;
    }
    .small {
      font-size: 12px;
      fill: #bac1be;
    }
    .tiny {
      font-size: 10px;
      fill: #94a3b8;
    }
    .box {
      rx: 4;
      ry: 4;
      fill: #1a2e35;
      stroke: #2a3731;
      stroke-width: 1;
    }
    .accent {
      rx: 4;
      ry: 4;
      fill: rgba(98, 254, 181, 0.14);
      stroke: rgba(98, 254, 181, 0.45);
      stroke-width: 1;
    }
    .shard {
      fill: rgba(98, 254, 181, 0.18);
      stroke: rgba(98, 254, 181, 0.35);
      stroke-width: 0.5;
    }
    .arrow {
      stroke: #94a3b8;
      stroke-width: 1;
      fill: none;
    }
    .mono {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      fill: #bac1be;
    }
  </style>

  <text x="300" y="26" text-anchor="middle" class="title">
    One list call, 640,000 reads
  </text>

  <!-- the call -->
  <rect x="20" y="104" width="150" height="44" class="accent" />
  <text x="95" y="122" text-anchor="middle" class="mono">ListBuckets</text>
  <text x="95" y="138" text-anchor="middle" class="mono">with_size=true</text>

  <!-- arrow 1 -->
  <line x1="170" y1="126" x2="212" y2="126" class="arrow" />
  <path d="M 212 126 l -6 -3.5 v 7 z" fill="#94a3b8" />
  <text x="191" y="116" text-anchor="middle" class="tiny">× 500</text>

  <!-- buckets stack -->
  <rect x="224" y="88" width="110" height="30" class="box" />
  <rect x="220" y="96" width="110" height="30" class="box" />
  <rect x="216" y="104" width="110" height="30" class="box" />
  <text x="271" y="124" text-anchor="middle" class="small">bucket 1…500</text>
  <text x="271" y="152" text-anchor="middle" class="tiny">
    one page of buckets
  </text>

  <!-- arrow 2 -->
