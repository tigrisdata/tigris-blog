<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 232"
  width="600"
  height="232"
  style="background: transparent"
>
  <style>
    text {
      font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI",
        Helvetica, Arial, sans-serif;
    }
    .title {
      font-size: 16px;
      fill: #62feb5;
      font-weight: 600;
    }
    .sub {
      font-size: 12px;
      fill: #94a3b8;
    }
    .small {
      font-size: 12px;
      fill: #bac1be;
    }
    .tiny {
      font-size: 10px;
      fill: #94a3b8;
    }
    .cell {
      rx: 2;
      ry: 2;
      fill: #1a2e35;
      stroke: #2a3731;
      stroke-width: 0.5;
    }
    .hot {
      rx: 2;
      ry: 2;
      fill: rgba(98, 254, 181, 0.4);
      stroke: #62feb5;
      stroke-width: 1;
    }
  </style>

  <text x="300" y="26" text-anchor="middle" class="title">
    One tenant's buckets, between two dashboard loads
  </text>

  <!-- 25 x 4 grid of cells, cell 16px + 4 gap = 20 pitch; grid width 25*20-4=496, x0=52; y0=48 -->
  <g>
    <!-- row 1 -->
    <rect class="cell" x="52" y="48" width="16" height="16" /><rect class="cell" x="72" y="48" width="16" height="16" /><rect class="cell" x="92" y="48" width="16" height="16" /><rect class="hot" x="112" y="48" width="16" height="16" /><rect class="cell" x="132" y="48" width="16" height="16" /><rect class="cell" x="152" y="48" width="16" height="16" /><rect class="cell" x="172" y="48" width="16" height="16" /><rect class="cell" x="192" y="48" width="16" height="16" /><rect class="cell" x="212" y="48" width="16" height="16" /><rect class="cell" x="232" y="48" width="16" height="16" /><rect class="cell" x="252" y="48" width="16" height="16" /><rect class="cell" x="272" y="48" width="16" height="16" /><rect class="cell" x="292" y="48" width="16" height="16" /><rect class="cell" x="312" y="48" width="16" height="16" /><rect class="cell" x="332" y="48" width="16" height="16" /><rect class="cell" x="352" y="48" width="16" height="16" /><rect class="hot" x="372" y="48" width="16" height="16" /><rect class="cell" x="392" y="48" width="16" height="16" /><rect class="cell" x="412" y="48" width="16" height="16" /><rect class="cell" x="432" y="48" width="16" height="16" /><rect class="cell" x="452" y="48" width="16" height="16" /><rect class="cell" x="472" y="48" width="16" height="16" /><rect class="cell" x="492" y="48" width="16" height="16" /><rect class="cell" x="512" y="48" width="16" height="16" /><rect class="cell" x="532" y="48" width="16" height="16" />
    <!-- row 2 -->
    <rect class="cell" x="52" y="68" width="16" height="16" /><rect class="cell" x="72" y="68" width="16" height="16" /><rect class="cell" x="92" y="68" width="16" height="16" /><rect class="cell" x="112" y="68" width="16" height="16" /><rect class="cell" x="132" y="68" width="16" height="16" /><rect class="cell" x="152" y="68" width="16" height="16" /><rect class="cell" x="172" y="68" width="16" height="16" /><rect class="cell" x="192" y="68" width="16" height="16" /><rect class="hot" x="212" y="68" width="16" height="16" /><rect class="cell" x="232" y="68" width="16" height="16" /><rect class="cell" x="252" y="68" width="16" height="16" /><rect class="cell" x="272" y="68" width="16" height="16" /><rect class="cell" x="292" y="68" width="16" height="16" /><rect class="cell" x="312" y="68" width="16" height="16" /><rect class="cell" x="332" y="68" width="16" height="16" /><rect class="cell" x="352" y="68" width="16" height="16" /><rect class="cell" x="372" y="68" width="16" height="16" /><rect class="cell" x="392" y="68" width="16" height="16" /><rect class="cell" x="412" y="68" width="16" height="16" /><rect class="cell" x="432" y="68" width="16" height="16" /><rect class="cell" x="452" y="68" width="16" height="16" /><rect class="cell" x="472" y="68" width="16" height="16" /><rect class="cell" x="492" y="68" width="16" height="16" /><rect class="hot" x="512" y="68" width="16" height="16" /><rect class="cell" x="532" y="68" width="16" height="16" />
    <!-- row 3 -->
    <rect class="cell" x="52" y="88" width="16" height="16" /><rect class="cell" x="72" y="88" width="16" height="16" /><rect class="cell" x="92" y="88" width="16" height="16" /><rect class="cell" x="112" y="88" width="16" height="16" /><rect class="cell" x="132" y="88" width="16" height="16" /><rect class="hot" x="152" y="88" width="16" height="16" /><rect class="cell" x="172" y="88" width="16" height="16" /><rect class="cell" x="192" y="88" width="16" height="16" /><rect class="cell" x="212" y="88" width="16" height="16" /><rect class="cell" x="232" y="88" width="16" height="16" /><rect class="cell" x="252" y="88" width="16" height="16" /><rect class="cell" x="272" y="88" width="16" height="16" /><rect class="cell" x="292" y="88" width="16" height="16" /><rect class="cell" x="312" y="88" width="16" height="16" /><rect class="cell" x="332" y="88" width="16" height="16" /><rect class="cell" x="352" y="88" width="16" height="16" /><rect class="cell" x="372" y="88" width="16" height="16" /><rect class="cell" x="392" y="88" width="16" height="16" /><rect class="cell" x="412" y="88" width="16" height="16" /><rect class="cell" x="432" y="88" width="16" height="16" /><rect class="cell" x="452" y="88" width="16" height="16" /><rect class="cell" x="472" y="88" width="16" height="16" /><rect class="cell" x="492" y="88" width="16" height="16" /><rect class="cell" x="512" y="88" width="16" height="16" /><rect class="cell" x="532" y="88" width="16" height="16" />
    <!-- row 4 -->
    <rect class="cell" x="52" y="108" width="16" height="16" /><rect class="cell" x="72" y="108" width="16" height="16" /><rect class="hot" x="92" y="108" width="16" height="16" /><rect class="cell" x="112" y="108" width="16" height="16" /><rect class="cell" x="132" y="108" width="16" height="16" /><rect class="cell" x="152" y="108" width="16" height="16" /><rect class="cell" x="172" y="108" width="16" height="16" /><rect class="cell" x="192" y="108" width="16" height="16" /><rect class="cell" x="212" y="108" width="16" height="16" /><rect class="cell" x="232" y="108" width="16" height="16" /><rect class="cell" x="252" y="108" width="16" height="16" /><rect class="cell" x="272" y="108" width="16" height="16" /><rect class="cell" x="292" y="108" width="16" height="16" /><rect class="cell" x="312" y="108" width="16" height="16" /><rect class="cell" x="332" y="108" width="16" height="16" /><rect class="cell" x="352" y="108" width="16" height="16" /><rect class="cell" x="372" y="108" width="16" height="16" /><rect class="hot" x="392" y="108" width="16" height="16" /><rect class="cell" x="412" y="108" width="16" height="16" /><rect class="cell" x="432" y="108" width="16" height="16" /><rect class="cell" x="452" y="108" width="16" height="16" /><rect class="cell" x="472" y="108" width="16" height="16" /><rect class="cell" x="492" y="108" width="16" height="16" /><rect class="cell" x="512" y="108" width="16" height="16" /><rect class="cell" x="532" y="108" width="16" height="16" />
  </g>

  <!-- legend -->
  <rect class="hot" x="150" y="142" width="12" height="12" />
  <text x="170" y="152" class="tiny">written since the last load</text>
  <rect class="cell" x="320" y="142" width="12" height="12" />
  <text x="340" y="152" class="tiny">size unchanged</text>

  <!-- takeaway -->
  <text x="300" y="184" text-anchor="middle" class="small">
    the old path recomputed every cell, every load —
  </text>
  <text x="300" y="202" text-anchor="middle" class="sub">
    1,280 reads apiece, for numbers that hadn't moved
  </text>
</svg>
