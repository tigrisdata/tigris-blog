<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 200"
  width="600"
  height="200"
  style="background: transparent"
>
  <style>
    text {
      font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI",
        Helvetica, Arial, sans-serif;
    }
    .title {
      font-size: 16px;
      fill: #62feb5;
      font-weight: 600;
    }
    .sub {
      font-size: 12px;
      fill: #94a3b8;
    }
    .small {
      font-size: 12px;
      fill: #bac1be;
    }
    .tiny {
      font-size: 10px;
      fill: #94a3b8;
    }
    .box {
      rx: 4;
      ry: 4;
      fill: #1a2e35;
      stroke: #2a3731;
      stroke-width: 1;
    }
    .accent {
      rx: 4;
      ry: 4;
      fill: rgba(98, 254, 181, 0.14);
      stroke: rgba(98, 254, 181, 0.45);
      stroke-width: 1;
    }
    .tick {
      stroke: #94a3b8;
      stroke-width: 1.5;
    }
    .arrowAccent {
      stroke: rgba(98, 254, 181, 0.8);
      stroke-width: 1.2;
      fill: none;
    }
  </style>

  <text x="300" y="26" text-anchor="middle" class="title">
    A write storm becomes one cache operation
  </text>

  <!-- incoming ticks: dense storm -->
  <g>
    <line class="tick" x1="46" y1="82" x2="46" y2="108" />
    <line class="tick" x1="54" y1="82" x2="54" y2="108" />
    <line class="tick" x1="61" y1="82" x2="61" y2="108" />
    <line class="tick" x1="67" y1="82" x2="67" y2="108" />
    <line class="tick" x1="75" y1="82" x2="75" y2="108" />
    <line class="tick" x1="81" y1="82" x2="81" y2="108" />
    <line class="tick" x1="90" y1="82" x2="90" y2="108" />
    <line class="tick" x1="96" y1="82" x2="96" y2="108" />
    <line class="tick" x1="104" y1="82" x2="104" y2="108" />
    <line class="tick" x1="111" y1="82" x2="111" y2="108" />
    <line class="tick" x1="119" y1="82" x2="119" y2="108" />
    <line class="tick" x1="126" y1="82" x2="126" y2="108" />
    <line class="tick" x1="134" y1="82" x2="134" y2="108" />
    <line class="tick" x1="140" y1="82" x2="140" y2="108" />
    <line class="tick" x1="149" y1="82" x2="149" y2="108" />
    <line class="tick" x1="156" y1="82" x2="156" y2="108" />
  </g>
  <text x="100" y="130" text-anchor="middle" class="small">100 writes/sec</text>
  <text x="100" y="144" text-anchor="middle" class="tiny">to one hot bucket</text>

  <line x1="166" y1="95" x2="216" y2="95" class="arrowAccent" />
  <path d="M 216 95 l -6 -3.5 v 7 z" fill="#62feb5" />

  <!-- debounce box -->
  <rect x="222" y="66" width="156" height="58" class="box" />
  <text x="300" y="90" text-anchor="middle" class="small">per-pod debounce</text>
  <text x="300" y="106" text-anchor="middle" class="tiny">
    in-memory, no network hop
  </text>
  <text x="300" y="140" text-anchor="middle" class="tiny">
    "already handled this bucket
  </text>
  <text x="300" y="152" text-anchor="middle" class="tiny">
    within the cooldown? drop it."
  </text>

  <line x1="384" y1="95" x2="434" y2="95" class="arrowAccent" />
  <path d="M 434 95 l -6 -3.5 v 7 z" fill="#62feb5" />

  <!-- single op out -->
  <rect x="440" y="66" width="130" height="58" class="accent" />
  <text x="505" y="90" text-anchor="middle" class="small">~1 TTL-shorten</text>
  <text x="505" y="106" text-anchor="middle" class="tiny">per 15-min window</text>

  <!-- takeaway -->
  <text x="300" y="186" text-anchor="middle" class="sub">
    the suppressed writes cost nothing — not even a round-trip to the cache
  </text>
</svg>
