<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 190"
  width="600"
  height="190"
  style="background: transparent"
>
  <style>
    text {
      font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI",
        Helvetica, Arial, sans-serif;
    }
    .title {
      font-size: 16px;
      fill: #62feb5;
      font-weight: 600;
    }
    .sub {
      font-size: 12px;
      fill: #94a3b8;
    }
    .small {
      font-size: 12px;
      fill: #bac1be;
    }
    .tiny {
      font-size: 10px;
      fill: #94a3b8;
    }
    .axis {
      stroke: #2a3731;
      stroke-width: 1;
    }
    .mark {
      stroke: #94a3b8;
      stroke-width: 1;
      stroke-dasharray: 2 3;
    }
    .span {
      stroke: rgba(98, 254, 181, 0.8);
      stroke-width: 2;
    }
  </style>

  <text x="300" y="26" text-anchor="middle" class="title">
    A write lands while a cache fill is in flight
  </text>

  <!-- timeline -->
  <line x1="60" y1="110" x2="560" y2="110" class="axis" />

  <!-- the in-flight fill span -->
  <line x1="120" y1="110" x2="420" y2="110" class="span" />
  <text x="270" y="94" text-anchor="middle" class="tiny">
    fill in flight — tens of milliseconds
  </text>

  <!-- T0 -->
  <line x1="120" y1="104" x2="120" y2="128" class="mark" />
  <text x="120" y="146" text-anchor="middle" class="small">T0</text>
  <text x="120" y="162" text-anchor="middle" class="tiny">cache miss:</text>
  <text x="120" y="174" text-anchor="middle" class="tiny">fill dispatched</text>

  <!-- T1 -->
  <line x1="270" y1="104" x2="270" y2="128" class="mark" />
  <text x="270" y="146" text-anchor="middle" class="small">T1</text>
  <text x="270" y="162" text-anchor="middle" class="tiny">a write lands —</text>
  <text x="270" y="174" text-anchor="middle" class="tiny">size changes</text>

  <!-- T2 -->
  <line x1="420" y1="104" x2="420" y2="128" class="mark" />
  <text x="420" y="146" text-anchor="middle" class="small">T2</text>
  <text x="420" y="162" text-anchor="middle" class="tiny">fill returns, caches</text>
  <text x="420" y="174" text-anchor="middle" class="tiny">the pre-write size</text>

  <!-- resolution -->
  <text x="512" y="146" text-anchor="middle" class="tiny" fill="#62feb5">
    healed by the next
  </text>
  <text x="512" y="158" text-anchor="middle" class="tiny" fill="#62feb5">
    write, or by TTL
  </text>

</svg>
