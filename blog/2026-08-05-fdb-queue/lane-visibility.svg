<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 820 328"
  width="820"
  height="328"
  preserveAspectRatio="xMidYMid meet"
  style="background: transparent"
>
  <style>
    text {
      font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI",
        Helvetica, Arial, sans-serif;
    }
    .title { font-size: 20px; fill: #62feb5; font-weight: 600; }
    .sub { font-size: 15px; fill: #94a3b8; }
    .label { font-size: 16px; fill: #e2e8f0; font-weight: 600; }
    .small { font-size: 14px; fill: #bac1be; }
    .edge { font-size: 14px; fill: #94a3b8; font-weight: 500; }
    .pass-edge { font-size: 14px; fill: #62feb5; font-weight: 600; }
    .fail-edge { font-size: 14px; fill: #fbbf24; font-weight: 600; }
    .box { rx: 6; ry: 6; fill: #1a2e35; stroke: #2a3731; stroke-width: 1; }
    .ghost-box { rx: 6; ry: 6; fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 5 4; opacity: 0.7; }
    .hi-box { rx: 6; ry: 6; fill: rgba(98, 254, 181, 0.08); stroke: rgba(98, 254, 181, 0.45); stroke-width: 1; }
    .arrow { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .pass-arrow { stroke: #62feb5; stroke-width: 1.5; fill: none; }
    .fail-arrow { stroke: #fbbf24; stroke-width: 1.5; fill: none; }
    .cursor { stroke: #62feb5; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .leader { stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowhead-pass" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#62feb5" />
    </marker>
    <marker id="arrowhead-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24" />
    </marker>
  </defs>
<text x="410" y="30" text-anchor="middle" class="title">One lane of the queue</text><text x="410" y="50" text-anchor="middle" class="sub">taskType = TTL, itemSpace = 17 · FDB keeps keys sorted, so key order is time order</text><g transform="translate(0,16)"><rect x="40" y="96" width="118" height="54" class="box" /><text x="99.0" y="128.0" text-anchor="middle" class="label">09:00:01</text><text x="99.0" y="168" text-anchor="middle" class="pass-edge">ready</text><rect x="176" y="96" width="118" height="54" class="box" /><text x="235.0" y="128.0" text-anchor="middle" class="label">09:02:47</text><text x="235.0" y="168" text-anchor="middle" class="pass-edge">ready</text><rect x="312" y="96" width="118" height="54" class="box" /><text x="371.0" y="128.0" text-anchor="middle" class="label">09:14:03</text><text x="371.0" y="168" text-anchor="middle" class="pass-edge">ready</text><line x1="470" y1="84" x2="470" y2="196" class="cursor" /><text x="470" y="76" text-anchor="middle" class="pass-edge">now</text><text x="470" y="212" text-anchor="middle" class="edge">(this reader&#8217;s clock)</text><rect x="512" y="96" width="118" height="54" class="ghost-box" /><text x="571.0" y="128.0" text-anchor="middle" class="label">10:22:00</text><text x="571.0" y="168" text-anchor="middle" class="edge">invisible</text><rect x="648" y="96" width="118" height="54" class="ghost-box" /><text x="707.0" y="128.0" text-anchor="middle" class="label">11:00:09</text><text x="707.0" y="168" text-anchor="middle" class="edge">invisible</text><path d="M40,240 L460,240" class="pass-arrow" marker-end="url(#arrowhead-pass)" /><text x="250" y="260" text-anchor="middle" class="pass-edge">Peek reads exactly this range</text><path d="M40,288 L776,288" class="arrow" marker-end="url(#arrowhead)" /><text x="778" y="280" text-anchor="end" class="edge">key order = time order</text></g></svg>