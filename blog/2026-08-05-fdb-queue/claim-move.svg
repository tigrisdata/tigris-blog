<text x="410" y="30" text-anchor="middle" class="title">Claiming task B is one transaction</text><text x="410" y="50" text-anchor="middle" class="sub">delete the row, reinsert it past every reader&#8217;s window, all in one FDB commit</text><g transform="translate(0,16)"><rect x="40" y="112" width="112" height="54" class="box" /><text x="96.0" y="144.0" text-anchor="middle" class="label">08:59:12</text><text x="96.0" y="184" text-anchor="middle" class="pass-edge">ready</text><rect x="168" y="112" width="112" height="54" class="ghost-box" /><text x="224.0" y="144.0" text-anchor="middle" class="label">09:02:47</text><text x="224.0" y="184" text-anchor="middle" class="fail-edge">deleted</text><rect x="296" y="112" width="112" height="54" class="box" /><text x="352.0" y="144.0" text-anchor="middle" class="label">09:11:30</text><text x="352.0" y="184" text-anchor="middle" class="pass-edge">ready</text><line x1="452" y1="98" x2="452" y2="208" class="cursor" /><text x="452" y="224" text-anchor="middle" class="pass-edge">now</text><rect x="506" y="112" width="170" height="54" class="hi-box" /><text x="591.0" y="144.0" text-anchor="middle" class="label">task B</text><text x="591.0" y="184" text-anchor="middle" class="pass-edge">at now + 6 min · new lease id</text><path d="M224,104 Q 410,44 588,104" class="pass-arrow" marker-end="url(#arrowhead-pass)" /><text x="410" y="68" text-anchor="middle" class="pass-edge">delete + reinsert</text><text x="410" y="268" text-anchor="middle" class="sub">the row now sits past every reader&#8217;s window: claimed, with no lock anywhere</text></g></svg>