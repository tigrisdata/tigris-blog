<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 400"
  width="640"
  height="400"
  style="background: transparent"
>
  <style>
    text {
      font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI",
        Helvetica, Arial, sans-serif;
    }
    .maintitle {
      font-size: 16px;
      fill: #62feb5;
      font-weight: 600;
    }
    .maintsub {
      font-size: 12px;
      fill: #94a3b8;
    }
    .title {
      font-size: 13px;
      fill: #e2e8f0;
      font-weight: 600;
    }
    .sub {
      font-size: 10.5px;
      fill: #94a3b8;
    }
    .caption {
      font-size: 13px;
      fill: #94a3b8;
    }
    .node {
      fill: #1a2e35;
      stroke: #2a3731;
      stroke-width: 1;
    }
    .seam {
      stroke: #94a3b8;
      stroke-width: 1;
      stroke-dasharray: 4 4;
      stroke-opacity: 0.35;
      fill: none;
    }
    .icon {
      stroke: #e2e8f0;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style>

  <!-- title and subtitle -->
  <text x="320" y="26" text-anchor="middle" class="maintitle">
    Five systems, ten seams
  </text>
  <text x="320" y="46" text-anchor="middle" class="maintsub">Every dashed line is a place where state can drift out of sync</text>

  <!-- seams: one line per pair, drawn first so circles sit on top -->
  <line x1="130" y1="135" x2="325" y2="112" class="seam" />
  <line x1="130" y1="135" x2="515" y2="140" class="seam" />
  <line x1="130" y1="135" x2="205" y2="300" class="seam" />
  <line x1="130" y1="135" x2="455" y2="300" class="seam" />
  <line x1="325" y1="112" x2="515" y2="140" class="seam" />
  <line x1="325" y1="112" x2="205" y2="300" class="seam" />
  <line x1="325" y1="112" x2="455" y2="300" class="seam" />
  <line x1="515" y1="140" x2="205" y2="300" class="seam" />
  <line x1="515" y1="140" x2="455" y2="300" class="seam" />
  <line x1="205" y1="300" x2="455" y2="300" class="seam" />

  <!-- the five systems -->
  <circle cx="130" cy="135" r="58" class="node" />
  <g transform="translate(130,113)" class="icon">
    <path d="M-11,-9 h22 a3,3 0 0 1 3,3 v9 a3,3 0 0 1 -3,3 h-11 l-6,6 v-6 h-5 a3,3 0 0 1 -3,-3 v-9 a3,3 0 0 1 3,-3 z" />
    <line x1="-6" y1="-3" x2="6" y2="-3" />
    <line x1="-6" y1="1" x2="2" y2="1" />
  </g>
  <text x="130" y="145" text-anchor="middle" class="title">Postgres</text>
  <text x="130" y="161" text-anchor="middle" class="sub">conversation history</text>

  <circle cx="325" cy="112" r="58" class="node" />
  <g transform="translate(325,90)" class="icon">
    <path d="M0,-11 C-2,-13 -6,-13 -8,-11 C-11,-11 -13,-8 -12,-5 C-14,-4 -15,0 -13,2 C-14,5 -12,8 -9,8 C-8,11 -4,12 0,10 Z" />
    <path d="M0,-11 C2,-13 6,-13 8,-11 C11,-11 13,-8 12,-5 C14,-4 15,0 13,2 C14,5 12,8 9,8 C8,11 4,12 0,10 Z" />
    <path d="M-6,-5 C-4,-4 -4,-1 -6,0" />
    <path d="M6,-5 C4,-4 4,-1 6,0" />
  </g>
  <text x="325" y="122" text-anchor="middle" class="title">Pinecone + Redis</text>
  <text x="325" y="138" text-anchor="middle" class="sub">memory</text>

  <circle cx="515" cy="140" r="58" class="node" />
  <g transform="translate(515,118)" class="icon">
    <line x1="-7" y1="-12" x2="-7" y2="12" />
    <path d="M-7,-12 L9,-8 L-7,-3 Z" />
  </g>
  <text x="515" y="150" text-anchor="middle" class="title">LangGraph</text>
  <text x="515" y="166" text-anchor="middle" class="sub">checkpoints</text>

  <circle cx="205" cy="300" r="58" class="node" />
  <g transform="translate(205,278)" class="icon">
    <path d="M-11,-5 L-8,10 a3,2 0 0 0 3,2 h10 a3,2 0 0 0 3,-2 L11,-5" />
    <ellipse cx="0" cy="-5" rx="11" ry="3" />
    <path d="M-8,-7 A8,7 0 0 1 8,-7" />
  </g>
  <text x="205" y="310" text-anchor="middle" class="title">S3 bucket</text>
  <text x="205" y="326" text-anchor="middle" class="sub">working files</text>

  <circle cx="455" cy="300" r="58" class="node" />
  <g transform="translate(455,278)" class="icon">
    <rect x="-13" y="-12" width="9" height="8" rx="1.5" />
    <rect x="4" y="-12" width="9" height="8" rx="1.5" />
    <rect x="-4.5" y="4" width="9" height="8" rx="1.5" />
    <line x1="-8" y1="-4" x2="-1" y2="4" />
    <line x1="8" y1="-4" x2="1" y2="4" />
  </g>
  <text x="455" y="310" text-anchor="middle" class="title">Temporal</text>
  <text x="455" y="326" text-anchor="middle" class="sub">run metadata</text>

  <!-- caption -->
  <text x="320" y="390" text-anchor="middle" class="caption">
    No moment captures all five in one consistent state.
  </text>
</svg>
